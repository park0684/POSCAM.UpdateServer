name: Incremental Update CI

on:
  push:
    branches:
      - agent/incremental-file-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore POSCAM.UpdateServer.sln

      - name: Build
        run: dotnet build POSCAM.UpdateServer.sln -c Release --no-restore

      - name: Test
        run: dotnet test POSCAM.UpdateServer.sln -c Release --no-build
